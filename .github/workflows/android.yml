name: Build SideDock Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Web Assets for Android
        run: |
          mkdir -p android/app/src/main/assets/renderer
          mkdir -p android/app/src/main/assets/assets
          cp -r renderer/* android/app/src/main/assets/renderer/
          cp -r assets/* android/app/src/main/assets/assets/

      - name: Grant Gradlew Execute Permission
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideDock-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-v1.0.0
          name: Side Dock Mobile App (APK)
          body: |
            ## 📱 Side Dock Mobile App (Android APK)
            - **Google & Supabase Cloud Sync:** Syncs Tasks, Notes, and Habits with Laptop seamlessly!
            - **Native Dark Navy Mobile UI:** Touch-optimized layout with bottom navigation.
            - **Offline Support:** Full local storage persistence.

            ### 📥 Download & Install:
            Download `SideDock.apk` below and open it on your Android phone to install.
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
