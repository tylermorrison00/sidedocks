name: Build SideDock Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compute Version Code
        run: echo "VERSION_CODE=$((1000 + ${{ github.run_number }}))" >> $GITHUB_ENV
      - name: Prepare Web Assets for Android
        run: |
          mkdir -p android/app/src/main/assets/renderer
          mkdir -p android/app/src/main/assets/assets
          cp -r renderer/* android/app/src/main/assets/renderer/
          cp -r assets/* android/app/src/main/assets/assets/
      - name: Check Gradle Wrapper Present
        run: |
          test -f android/gradlew || { echo "::error::android/gradlew is missing — commit the Gradle wrapper from the Antigravity project first."; exit 1; }
          test -f android/settings.gradle.kts || test -f android/settings.gradle || { echo "::error::android/settings.gradle(.kts) is missing — the Android project is incomplete."; exit 1; }
      - name: Grant Gradlew Execute Permission
        run: chmod +x android/gradlew
      - name: Restore Signing Keystore (if secret set)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            if echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore 2>/dev/null; then
              echo "KEYSTORE_PATH=$PWD/android/app/release.keystore" >> $GITHUB_ENV
            else
              echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not valid base64 — falling back to debug signing, uninstall old app first."
              rm -f android/app/release.keystore
            fi
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — APK will be debug-signed and cannot update over a differently-signed install."
          fi
      - name: Build Android APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PversionCode=$VERSION_CODE -PkeystorePath="$KEYSTORE_PATH" -PkeystorePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -PkeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" -PkeyPassword="${{ secrets.ANDROID_KEY_PASSWORD }}" --no-daemon
      - name: Prepare Named APK and version.json
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Side.Dock.apk
          cat > version.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "1.0.0",
            "apkUrl": "https://github.com/tylermorrison00/sidedocks/releases/download/mobile-v1.0.0/Side.Dock.apk",
            "apkName": "Side.Dock.apk"
          }
          EOF
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Side.Dock.apk
          path: android/app/build/outputs/apk/release/Side.Dock.apk
      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-v1.0.0
          name: Side Dock Mobile App (APK)
          body: |
            ## Side Dock Mobile App (Android APK)
            - Google & Supabase Cloud Sync
            - Native Dark Navy Mobile UI
            - Offline Support
            - In-app Update via version.json
          files: |
            android/app/build/outputs/apk/release/Side.Dock.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
